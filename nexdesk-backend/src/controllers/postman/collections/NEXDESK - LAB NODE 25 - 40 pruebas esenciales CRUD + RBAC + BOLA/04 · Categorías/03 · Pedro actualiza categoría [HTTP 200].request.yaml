$kind: http-request
description: "Caso original LAB26 #47. Esperado HTTP 200. Ejecutar en orden cuando dependa de datos anteriores."
url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "LAB26 Redes Actualizada {{runId}}",
      "descripcion": "Validación CRUD"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenPedro}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let data = {}; try { data = pm.response.json(); } catch(e) {}
    language: text/javascript
order: 3000
