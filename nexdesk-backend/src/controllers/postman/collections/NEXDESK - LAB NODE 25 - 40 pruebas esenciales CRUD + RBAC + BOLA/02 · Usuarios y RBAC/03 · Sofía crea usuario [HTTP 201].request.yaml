$kind: http-request
description: "Caso original LAB26 #18. Guarda credencialTemporal de forma privada; la colección NO la almacena automáticamente."
url: "{{baseUrl}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo_documento": "CC",
      "numero_documento": "LAB25{{runId}}01",
      "nombre": "Andres",
      "apellido": "Ramirez",
      "email": "{{emailNuevoUsuario}}",
      "rol": "usuario"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenSofia}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      let data = {}; try { data = pm.response.json(); } catch(e) {}
      if (pm.response.code >= 200 && pm.response.code < 300) { const v = data.usuario?.id; if(v !== undefined && v !== null) pm.collectionVariables.set("usuarioId", String(v)); }
      pm.test("Creación devuelve JSON",()=>pm.expect(data).to.be.an("object"));
    language: text/javascript
order: 3000
