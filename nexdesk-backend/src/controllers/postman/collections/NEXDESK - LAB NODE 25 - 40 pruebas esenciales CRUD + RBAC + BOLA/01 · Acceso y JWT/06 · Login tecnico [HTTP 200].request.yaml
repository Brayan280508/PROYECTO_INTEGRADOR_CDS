$kind: http-request
description: "Caso original LAB26 #08. Los tokens son secretos. Los usuarios deben existir en Supabase Auth y estar vinculados a public.usuarios."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailTecnico}}",
      "password": "{{passwordTecnico}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let data = {}; try { data = pm.response.json(); } catch(e) {}
      if (pm.response.code >= 200 && pm.response.code < 300) { const v = data.access_token; if(v !== undefined && v !== null) pm.collectionVariables.set("tokenTecnico", String(v)); }
    language: text/javascript
order: 6000
