$kind: http-request
description: "Caso original LAB26 #01. Esperado HTTP 200. Ejecutar en orden cuando dependa de datos anteriores."
url: "{{baseUrl}}/api/estado"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let data = {}; try { data = pm.response.json(); } catch(e) {}
    language: text/javascript
order: 1000
